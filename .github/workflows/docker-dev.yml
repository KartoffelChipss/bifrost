name: Build and Publish Dev Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Unreleased builds for testing, published only to the GitHub Container
# Registry. Every run pushes ghcr.io/<owner>/bifrost:sha-<commit>. A run on
# main also moves the edge tag. Releases are built by docker-release-ghcr.yml.
#
# The job logs in to the registry only after the image is built and checked,
# so no registry credential exists on the runner during the build.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      LOCAL_IMAGE: bifrost:check

    steps:
      - name: Set image name and version
        run: |
          echo "DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "DEV_VERSION=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keeps the workflow token out of .git/config in the build context.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            REPO_URL=https://github.com/${{ github.repository }}
            APP_VERSION=${{ env.DEV_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.DEV_VERSION }}
          cache-from: type=gha,scope=${{ github.repository }}-dev
          cache-to: type=gha,scope=${{ github.repository }}-dev

      - name: Check image for credentials
        run: .github/scripts/check-image-credentials.sh "$LOCAL_IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the image that was checked, not a second build.
      - name: Push image
        run: |
          docker tag "$LOCAL_IMAGE" "$DOCKER_IMAGE:$DEV_VERSION"
          docker push "$DOCKER_IMAGE:$DEV_VERSION"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$LOCAL_IMAGE" "$DOCKER_IMAGE:edge"
            docker push "$DOCKER_IMAGE:edge"
          fi
